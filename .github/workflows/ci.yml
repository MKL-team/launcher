name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-c:
    name: C Core Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_path: build/bin/mkl_app
          - os: windows-2022
            artifact_path: build/bin/mkl_app.exe
          - os: macos-14
            artifact_path: build/bin/mkl_app
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkl-cli-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ matrix.artifact_path }}

  core-rust:
    name: Rust Core Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    defaults:
      run:
        working-directory: src/rust/mkl_core_rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test
