name: Release

on:
  push:
    tags: ['v*']

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset_name: mkl-windows-x64.zip
          - os: ubuntu-22.04
            asset_name: mkl-linux-x64.tar.gz
          - os: macos-14
            asset_name: mkl-macos-arm64.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMKL_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Package Windows (deploy Qt + zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build\bin\mkl_app.exe"
          $wdq = Get-Command windeployqt -ErrorAction SilentlyContinue
          if ($wdq) {
            & $wdq.Source --release --no-translations $exe
          } else {
            $wdqPath = "$env:Qt6_DIR\..\..\..\bin\windeployqt.exe"
            if (-not (Test-Path $wdqPath)) { Write-Error "windeployqt not found"; exit 1 }
            & $wdqPath --release --no-translations $exe
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\bin\*" -DestinationPath "dist\${{ matrix.asset_name }}" -Force

      - name: Package macOS (deploy Qt + dmg)
        if: runner.os == 'macOS'
        run: |
          DEPLOY=$(command -v macdeployqt || true)
          if [ -z "$DEPLOY" ]; then DEPLOY="$Qt6_DIR/../../../bin/macdeployqt"; fi
          "$DEPLOY" build/bin/mkl_app.app -always-overwrite
          mkdir -p dist
          hdiutil create -volname "MKL" -srcfolder build/bin/mkl_app.app -ov -format UDZO "dist/${{ matrix.asset_name }}"

      - name: Package Linux (tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset_name }}" -C build/bin mkl_app

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkl-pkg-${{ matrix.os }}
          if-no-files-found: error
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mkl-pkg-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
