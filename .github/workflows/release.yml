name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    name: Verify & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Test (C core)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
          ctest --test-dir build --output-on-failure

      - uses: dtolnay/rust-toolchain@stable

      - name: Test (Rust core)
        working-directory: src/rust/mkl_core_rs
        run: cargo test

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          body: |
            MKL R2 架构骨架（C 核心 + Rust 模块 + 双工具链 CI 验证）。

            图形产物待各平台原生 UI 壳里程碑（R2-S4 起）：
            - R2-S1 C/Rust 核心骨架（本阶段）
            - R2-S4 Windows 壳（Win32）
            - R2-S5 macOS/Linux 壳（AppKit / GTK3）
            - R2-S6 移动端壳（Kotlin / Swift）+ 触控
